<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="doc-title">Log in</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<!-- ضعه هنا مباشرة داخل وسم style عادي -->
    <style>
        [dir="rtl"] .form-floating > label {
            right: 0;
            left: auto;
            transform-origin: top right;
        }
    </style>

</head>

<body class="overflow-hidden">

    <header class="d-flex justify-content-between p-3">
        <div>
            <h2 id="header-title">Log in</h2>
        </div>
        <div>
           <select class="form-select w-auto" id="lang-select" aria-label="Language select">
                <option value="en" selected>English</option>
                <option value="ar">العربية</option>
            </select>
        </div>

    </header>


    <div class="d-flex flex-column min-vh-100 bg-white">

        <div class="container col-10 col-md-8 col-xl-6 col-xxl-5 m-auto">


            <div class=" bg-light p-5 rounded-3 shadow-lg">

                <form action="home.html" method="get">
                    <h2 class="mt-2" id="form-title">Log in</h2>
                    <div class="form-floating mt-4 mb-3 mt-3"> <input type="email" class="form-control" id="floatingInput"
                        name="email"    placeholder="name@example.com" required> <label for="floatingInput" id="label-email">Email address</label> </div>

                    <div class="form-floating mb-4"> <input type="password" class="form-control" id="floatingPassword"
                        name="Password"    placeholder="Password" required> <label for="floatingPassword" id="label-password">Password</label> </div>



                    <button class="btn btn-primary w-100 p-3 mb-3" type="submit" id="btn-submit" name="submit">Sign in</button>


                </form>


            </div>


        </div>

    </div>












    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


        <!--كود الذكاء الاصطناعي لتغير الغة -->

<script>
        const translations = {
            en: {
                dir: "ltr",
                title: "Log in",
                email: "Email address",
                password: "Password",
                submit: "Sign in"
            },
            ar: {
                dir: "rtl",
                title: "تسجيل الدخول",
                email: "البريد الإلكتروني",
                password: "كلمة المرور",
                submit: "تسجيل الدخول"
            }
        };

        const langSelect = document.getElementById('lang-select');
        const htmlRoot = document.getElementById('html-root');
        const headerTitle = document.getElementById('header-title');
        const formTitle = document.getElementById('form-title');
        const labelEmail = document.getElementById('label-email');
        const labelPassword = document.getElementById('label-password');
        const btnSubmit = document.getElementById('btn-submit');
        const docTitle = document.getElementById('doc-title');

        langSelect.addEventListener('change', function () {
            const lang = this.value;
            const data = translations[lang];

            // 1. تغيير اتجاه ولغة المستند
            htmlRoot.setAttribute('dir', data.dir);
            htmlRoot.setAttribute('lang', lang);

            // 2. تحديث النصوص
            docTitle.textContent = data.title;
            headerTitle.textContent = data.title;
            formTitle.textContent = data.title;
            labelEmail.textContent = data.email;
            labelPassword.textContent = data.password;
            btnSubmit.textContent = data.submit;
        });
    </script>








</body>

</html>
